appId: mx.mdexa.app
productName: MDexa
electronVersion: 41.10.7
copyright: MDexa
artifactName: mdexa-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - build/icon.png
extraResources:
  - from: ../app/dist
    to: app
asar: true
mac:
  category: public.app-category.productivity
  target:
    - { target: dmg, arch: [x64, arm64] }
    - { target: zip, arch: [x64, arm64] }
win:
  target:
    - { target: nsis, arch: [x64] }
    - { target: portable, arch: [x64] }
nsis:
  artifactName: mdexa-${version}-instalador-windows.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: mdexa
  category: Office
  target: [AppImage, deb]
  maintainer: MDexa
  synopsis: "MDexa - actividades de equipo en un archivo .md compartido"
deb:
  packageName: mdexa
portable:
  artifactName: mdexa-${version}-portable-windows.${ext}
