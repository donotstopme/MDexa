# Compila y prueba la app de escritorio en macOS, Windows y Linux, y deja los instaladores como artefactos.
name: Escritorio
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   script: dist:mac,   nombre: macos }
          - { os: windows-latest, script: dist:win,   nombre: windows }
          - { os: ubuntu-latest,  script: dist:linux, nombre: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @gestor/app
      - run: npm run ${{ matrix.script }} -w @gestor/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }   # sin firma de código (se agrega con certificados propios)
      - uses: actions/upload-artifact@v4
        with:
          name: gestor-proyectos-${{ matrix.nombre }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error
